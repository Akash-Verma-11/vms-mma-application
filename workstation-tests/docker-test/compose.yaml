services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    image: vms-mma/docker-test:1.0.0
    container_name: vms-mma-docker-test

    ports:
      - "8080:80"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1/
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
